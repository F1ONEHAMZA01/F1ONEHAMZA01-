[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# index.html contains CSP-hashed inline assets generated by tools/build.mjs.
# Netlify post-processing must not rewrite them after the hashes are created.
[build.processing]
  skip_processing = true

[context.production.environment]
  NODE_ENV = "production"
